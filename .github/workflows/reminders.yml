name: Reminders

# Push reminders every 15 minutes (scripts/reminders.ts, docs/SPEC.md §4).
#
# Scheduled workflows only run from the default branch (main): this file has to be on main for
# the schedule to fire. It checks out the branch the app is deployed from (below), so main only
# needs updating when this file changes. GitHub delays scheduled runs and drops many under load
# (an hourly schedule ran about once every 8 hours), so it asks four times an hour, away from the
# busy top of the hour; any run that gets through sends what is due, and nothing goes out twice.
# In a public repository GitHub pauses schedules after 60 days without activity; re-enable it from
# the Actions tab.
#
# Setup: add the Firebase service account key (Firebase console → Project settings → Service
# accounts → Generate new private key) as the repository secret FIREBASE_SERVICE_ACCOUNT, pasting
# the whole JSON file. Optional: a repository variable APP_URL if the app is not served from
# https://<owner>.github.io/<repo>/.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only log what would be sent
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check for the service account secret
        id: check
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::The FIREBASE_SERVICE_ACCOUNT secret is not set, so no reminders were sent."
          fi

      # The schedule fires from main, but the app ships from its own branch: run the reminders code
      # that is live (repository variable APP_BRANCH overrides it).
      - uses: actions/checkout@v7
        if: steps.check.outputs.enabled == 'true'
        with:
          ref: ${{ vars.APP_BRANCH || 'claude/task-rating-app-feasibility-abixvp' }}

      - uses: actions/setup-node@v7
        if: steps.check.outputs.enabled == 'true'
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        if: steps.check.outputs.enabled == 'true'

      # Node 24 runs TypeScript directly (type stripping is on by default).
      - name: Send reminders
        if: steps.check.outputs.enabled == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_URL: ${{ vars.APP_URL }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: |
          export APP_URL="${APP_URL:-https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/}"
          node scripts/reminders.ts
