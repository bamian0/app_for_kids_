name: Reminders

# Hourly push reminders (scripts/reminders.ts, docs/SPEC.md §4).
#
# Scheduled workflows only run from the default branch (main): this file has to be on main for
# the hourly schedule to fire. It checks out the branch the app is deployed from (below), so main
# only needs updating when this file changes, in a commit whose message contains [skip ci] (main
# carries only this schedule; it never deploys). GitHub can delay scheduled runs or drop some under
# load; the job catches up on the next run without sending anything twice. The job also writes each
# month's results (streaks), so the schedule must keep running: GitHub pauses schedules after 60 days
# without repository activity, and the first step below re-enables this workflow on every run (an
# API call, never a commit). If it ever stops anyway, re-enable it from the Actions tab.
#
# Setup: add the Firebase service account key (Firebase console → Project settings → Service
# accounts → Generate new private key) as the repository secret FIREBASE_SERVICE_ACCOUNT, pasting
# the whole JSON file. Optional: a repository variable APP_URL if the app is not served from
# https://<owner>.github.io/<repo>/.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only log what would be sent
        type: boolean
        default: false

permissions:
  contents: read
  # The keepalive step re-enables this workflow.
  actions: write

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Keeps GitHub from pausing the schedule after 60 days without activity. Never fails the run.
      - name: Keep the schedule alive
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/reminders.yml/enable" || echo "::notice::Couldn't re-enable the schedule this time."

      - name: Check for the service account secret
        id: check
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::The FIREBASE_SERVICE_ACCOUNT secret is not set, so no reminders were sent."
          fi

      # The schedule fires from main, but the app ships from its own branch: run the reminders code
      # that is live (repository variable APP_BRANCH overrides it).
      - uses: actions/checkout@v7
        if: steps.check.outputs.enabled == 'true'
        with:
          ref: ${{ vars.APP_BRANCH || 'claude/task-rating-app-feasibility-abixvp' }}

      - uses: actions/setup-node@v7
        if: steps.check.outputs.enabled == 'true'
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        if: steps.check.outputs.enabled == 'true'

      # Node 24 runs TypeScript directly (type stripping is on by default).
      - name: Send reminders
        if: steps.check.outputs.enabled == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_URL: ${{ vars.APP_URL }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: |
          export APP_URL="${APP_URL:-https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/}"
          node scripts/reminders.ts
