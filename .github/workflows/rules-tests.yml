name: Emulator tests

# Security rules, the data layer and the end-to-end flow, all against the Firebase emulators.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The Firestore emulator is a Java program.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}

      - run: npm ci
      - run: npm run test:rules

      - name: Data layer
        run: npx firebase emulators:exec --config tests/data/firebase.data.json --only auth,firestore --project demo-stakes "npx vitest run --config vitest.data.config.ts"

      - run: npx playwright install --with-deps chromium
      - name: End to end
        run: npx firebase emulators:exec --only auth,firestore --project demo-stakes "npx playwright test"

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
